name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    # Skip on closed PRs — nothing to test
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Typecheck
        run: npm run typecheck
        working-directory: worker

      - name: Test
        run: npm test
        working-directory: worker

  # ── Conformance ──────────────────────────────────────────────────────────────
  # Spins up wrangler dev inline, runs the 222-check OID-FED 1.0 discovery walk.
  # Required check — blocks merge if any spec conformance check fails.

  conformance:
    name: OID-FED Conformance
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Start Worker (wrangler dev)
        run: npx wrangler dev --port 8787 &
        working-directory: worker

      - name: Wait for Worker to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz && echo "Worker ready" && exit 0
            sleep 1
          done
          echo "Worker did not start in time" && exit 1

      - name: Run OID-FED 1.0 conformance walk
        run: npm run conformance
        working-directory: worker

  # ── PR preview deploy ────────────────────────────────────────────────────────
  # Runs on every PR push. Deploys a short-lived Worker (pr-{N}) and a Pages
  # branch preview, then posts a ready-to-click comment on the PR.

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    environment: ci
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Deploy preview Worker
        id: worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PR=${{ github.event.pull_request.number }}
          NAME="oid-fed-demo-worker-pr-${PR}"
          URL="https://${NAME}.jralmaraz1.workers.dev"
          # --name overrides wrangler.jsonc name; --var overrides BASE_URL var
          npx wrangler deploy \
            --name "$NAME" \
            --compatibility-date 2024-10-22 \
            --compatibility-flags nodejs_compat \
            --var "BASE_URL:${URL}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Deploy preview SPA (Pages branch preview)
        id: spa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BRANCH="${{ github.head_ref }}"
          npx wrangler pages deploy spa \
            --project-name=oid-fed-demo \
            --branch="$BRANCH"
          # Cloudflare slugifies branch names: slashes → hyphens, lowercase
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-\|-$//g')
          echo "url=https://${SLUG}.oid-fed-demo.pages.dev" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Post preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const workerUrl = '${{ steps.worker.outputs.url }}';
            const spaUrl    = '${{ steps.spa.outputs.url }}';
            const spaLink   = `${spaUrl}/?worker=${encodeURIComponent(workerUrl)}`;
            const sha       = context.payload.pull_request.head.sha.slice(0, 7);

            const body = [
              '## Preview deployment',
              '',
              `| | URL |`,
              `|---|---|`,
              `| Worker | ${workerUrl}/healthz |`,
              `| SPA | [${spaLink}](${spaLink}) |`,
              '',
              `> SPA link has \`?worker=\` pre-filled to this PR's Worker instance.`,
              `> Commit: \`${sha}\``,
            ].join('\n');

            // Update existing comment if present, otherwise create
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('Preview deployment')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Preview cleanup ───────────────────────────────────────────────────────────
  # Deletes the preview Worker when the PR is merged or closed.
  # Pages branch previews persist automatically (Cloudflare keeps them).

  cleanup-preview:
    name: Cleanup Preview Worker
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    environment: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Delete preview Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PR=${{ github.event.pull_request.number }}
          npx wrangler delete --name "oid-fed-demo-worker-pr-${PR}" --force || true

  # ── Production deploy ─────────────────────────────────────────────────────────
  # Only runs when changes land on main.

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Deploy Worker
        run: npx wrangler deploy --env production
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-spa:
    name: Deploy SPA
    runs-on: ubuntu-latest
    needs: deploy-worker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: ci
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy spa --project-name=oid-fed-demo --branch=main
